<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NODAL — Bengaluru Metro Intelligence</title>
<link rel="stylesheet" href="vendor/maplibre-gl.css">
<script src="vendor/maplibre-gl.js"></script><script src="vendor/echarts.min.js"></script>
<style>
:root{--bg:#080D18;--bg2:#101827;--bg3:#172235;--cy:#00D4FF;--bl:#617CFF;--ok:#32D69A;--wn:#FFB84D;--cr:#FF5470;--tx:#F1F5FC;--tx2:#9AA9BE;--bd:#243350}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:13px/1.45 Inter,"IBM Plex Sans",system-ui,sans-serif;overflow:hidden}
#app{display:grid;grid-template-columns:auto minmax(0,1fr) 420px;grid-template-rows:52px minmax(0,1fr);height:100vh}
#top{grid-column:1/4;display:flex;align-items:center;gap:14px;padding:0 14px;background:var(--bg2);border-bottom:1px solid var(--bd);min-width:0}
.brand{font:600 17px "Space Grotesk",Inter,sans-serif;letter-spacing:.16em;color:var(--cy);white-space:nowrap}.brand small{font:400 10px Inter;letter-spacing:0;color:var(--tx2);margin-left:8px}
#q{width:260px;background:var(--bg);color:var(--tx);border:1px solid var(--bd);padding:6px 10px;border-radius:18px;font:inherit}#q:focus{outline:1px solid var(--cy)}
.seg{display:flex;border:1px solid var(--bd);border-radius:6px;overflow:hidden}.seg button{background:var(--bg);color:var(--tx2);border:0;border-right:1px solid var(--bd);padding:6px 10px;cursor:pointer;font:inherit}
.seg button:last-child{border:0}.seg button.on{background:var(--cy);color:#001018;font-weight:600}.seg button:hover:not(.on){color:var(--tx)}
.sp{flex:1}.ib{background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:6px;padding:6px 10px;cursor:pointer;font:inherit}.ib:hover{border-color:var(--cy)}
nav{background:linear-gradient(180deg,#0f1e30 0%,var(--bg2) 60%,#0a1420 100%);border-right:1px solid var(--bd);width:196px;transition:width .25s;overflow:hidden;display:flex;flex-direction:column;padding-top:6px}nav.c{width:50px}
nav button{all:unset;cursor:pointer;padding:10px 16px;color:var(--tx2);white-space:nowrap;border-left:2px solid transparent;transition:background .15s,color .15s,border-color .15s,transform .12s;border-radius:0 6px 6px 0;margin:1px 6px 1px 0;display:block;width:calc(100% - 6px)}nav button:hover,nav button:focus-visible{background:var(--bg3);color:var(--tx);transform:translateX(2px);border-left-color:rgba(0,212,255,.35)}
nav button.on{color:var(--cy);border-color:var(--cy);background:linear-gradient(90deg,rgba(0,212,255,.12) 0%,var(--bg3) 100%);font-weight:500}nav.c button span{display:none}nav .sp{flex:1}nav.c .nav-section-label{display:none}
#stage{position:relative;display:flex;min-width:0;min-height:0;background:var(--bg)}
#map,#graph{flex:1;min-width:0;position:relative}#graph{display:none;background:#0d1524}#graph canvas{display:block;width:100%;height:100%}
#stage.m-graph #map{display:none}#stage.m-graph #graph{display:block}#stage.m-split #graph{display:block;border-left:2px solid var(--bd)}#stage.m-graph #layers{display:none}
.gh{position:absolute;left:8px;top:8px;font-size:11px;color:var(--tx2);background:#0d1524e0;padding:3px 8px;border:1px solid var(--bd);pointer-events:none}
#layers{position:absolute;z-index:5;left:10px;top:10px;width:210px;background:#101827e6;backdrop-filter:blur(8px);border:1px solid var(--bd);border-radius:8px;padding:8px 10px;max-height:calc(100% - 20px);overflow:auto}
#layers h4{margin:0 0 4px;font-size:11px;letter-spacing:.1em;color:var(--tx2);cursor:pointer;display:flex;justify-content:space-between}#layers.c .lb{display:none}
#layers label{display:flex;gap:6px;align-items:center;margin:3px 0;color:var(--tx);font-size:12px;cursor:pointer}#layers label.dis{color:var(--tx2);opacity:.6;cursor:not-allowed}
.legend{position:absolute;z-index:4;left:10px;bottom:28px;background:#101827e6;border:1px solid var(--bd);border-radius:6px;padding:5px 9px;font-size:11px;display:flex;gap:10px;pointer-events:none}
.legend i{display:inline-block;width:14px;height:4px;margin-right:4px;vertical-align:middle;border-radius:2px}
aside{background:var(--bg2);border-left:1px solid var(--bd);overflow:auto;padding:14px;min-height:0}
h2{margin:0 0 10px;font:600 15px "Space Grotesk",Inter,sans-serif}h3{margin:14px 0 6px;font-size:11px;color:var(--tx2);text-transform:uppercase;letter-spacing:.08em}
label.f{display:block;color:var(--tx2);margin:8px 0 3px;font-size:12px}
aside input,aside select{width:100%;background:var(--bg);color:var(--tx);border:1px solid var(--bd);padding:6px 8px;border-radius:4px;font:inherit}aside input[type=range]{padding:0}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:8px}.row>*{flex:0 0 auto}.row select{width:auto}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}.stat{background:var(--bg3);padding:8px;border:1px solid var(--bd);border-radius:4px}
.stat b{display:block;font:600 20px "Space Grotesk",Inter;color:var(--cy)}.stat span{color:var(--tx2);font-size:11px}
table{width:100%;border-collapse:collapse;font-size:12px}td,th{padding:3px 5px;border-bottom:1px solid var(--bd);text-align:left;vertical-align:top}th{color:var(--tx2);font-weight:500}
.note{color:var(--tx2);font-size:11.5px;border-left:2px solid var(--bl);padding-left:8px;margin:8px 0}.err{color:var(--cr)}.ok{color:var(--ok)}.wn{color:var(--wn)}
.chart{height:220px;margin-top:6px}.fm{font-family:"IBM Plex Mono",monospace;background:var(--bg);padding:1px 4px;color:var(--cy)}
#info{background:var(--bg3);border:1px solid var(--bd);border-radius:6px;padding:10px;margin-bottom:12px}#info:empty{display:none}
.chip{display:inline-block;padding:0 7px;border-radius:9px;font-size:11px;color:#fff;margin-right:3px;text-shadow:0 0 2px #0008}
button.b{background:var(--bg3);color:var(--tx);border:1px solid var(--bd);padding:6px 11px;cursor:pointer;border-radius:4px;font:inherit}button.b:hover{border-color:var(--cy)}button.p{background:var(--cy);color:#001018;border-color:var(--cy);font-weight:600}
.maplibregl-popup-content{background:#101827;color:var(--tx);border:1px solid var(--cy);padding:5px 9px;font:12px Inter,sans-serif}.maplibregl-popup-tip{display:none}
nav button.hot{color:var(--wn);font-weight:600;border-left-color:var(--wn);background:linear-gradient(90deg,rgba(255,184,77,.12) 0%,var(--bg3) 100%)}
.nav-section-label{font-size:9.5px;font-weight:700;letter-spacing:.18em;color:var(--tx2);opacity:.55;padding:10px 16px 4px;text-transform:uppercase;white-space:nowrap;user-select:none}
#app.nopanel{grid-template-columns:auto minmax(0,1fr) 0}#app.nopanel aside{display:none}
.tabs{display:flex;gap:4px;margin:6px 0 10px;flex-wrap:wrap}.tabs button{background:var(--bg);color:var(--tx2);border:1px solid var(--bd);padding:5px 9px;border-radius:14px;cursor:pointer;font:inherit}.tabs button.on{background:var(--cy);color:#001018;border-color:var(--cy);font-weight:600}
.card{background:var(--bg3);border:1px solid var(--bd);border-radius:6px;padding:8px;margin:6px 0;cursor:pointer}.card:hover,.card.on{border-color:var(--cy)}.card b{color:var(--tx)}
.sl{display:grid;grid-template-columns:130px 1fr 44px;gap:6px;align-items:center;margin:2px 0;font-size:12px;color:var(--tx2)}.sl output{text-align:right;color:var(--tx)}
.hyp{background:#2a1d0a;border:1px solid var(--wn);color:var(--wn);padding:4px 8px;border-radius:4px;font-size:11px;margin:6px 0}
.pm{width:14px;height:14px;border-radius:50%;background:#fff;border:3px solid #ff8a3d;cursor:grab;box-shadow:0 0 0 2px #0b1220}
.bar{height:6px;background:var(--bd);border-radius:3px;overflow:hidden}.bar i{display:block;height:100%;background:var(--cy)}
@media(max-width:1100px){#app{grid-template-columns:auto minmax(0,1fr);grid-template-rows:52px 56vh auto;height:auto;overflow:auto}html,body{overflow:auto}#top{grid-column:1/3;flex-wrap:wrap;height:auto;padding:6px 10px}aside{grid-column:1/3;border-left:0}#q{width:160px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
#plegend{font-size:11px;color:var(--tx2);margin-top:6px;border-top:1px solid var(--bd);padding-top:6px}#plegend i{display:inline-block;width:14px;height:10px;margin-right:3px;vertical-align:middle}
.mmleg{display:flex;gap:8px;align-items:center;padding:3px 0;border-bottom:1px solid var(--bd);font-size:12px}
#vp{padding:6px 8px}
/* ---- Failure Simulator result panel ---- */
.fsim-banner{padding:10px 14px;border-radius:6px;font-weight:700;font-size:13px;margin:10px 0;letter-spacing:.03em}
.fsim-banner-err{background:#2d0808;border:1.5px solid #FF0000;color:#FF5555}
.fsim-banner-ok{background:#08201a;border:1.5px solid #32D69A;color:#32D69A}
.fsim-cards{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.fsim-card{background:var(--bg3);border-radius:8px;padding:14px 10px;text-align:center;border:1.5px solid var(--bd)}
.fsim-card-red{border-color:#FF0000;background:linear-gradient(135deg,#2a0000,#1a0808)}
.fsim-card-amber{border-color:#FF8C00;background:linear-gradient(135deg,#2a1800,#1a1008)}
.fsim-card-green{border-color:#32D69A;background:linear-gradient(135deg,#082018,#081a10)}
.fsim-num{font:700 28px "Space Grotesk",Inter,sans-serif;line-height:1.1;color:#fff}
.fsim-card-red .fsim-num{color:#FF5555}
.fsim-card-amber .fsim-num{color:#FFA500}
.fsim-card-green .fsim-num{color:#32D69A}
.fsim-label{font-size:11px;color:var(--tx2);margin-top:4px;line-height:1.3}
.fsim-affected-banner{background:#1f1000;border:1px solid #FF8C00;border-radius:6px;padding:10px 12px;margin:8px 0;font-size:12px;color:var(--tx)}
.fsim-affected-chips{margin-top:6px;display:flex;flex-wrap:wrap;gap:4px}
.fsim-section{margin:14px 0 0;border-top:1px solid var(--bd);padding-top:10px}
.fsim-section-title{font:600 10px Inter,sans-serif;letter-spacing:.12em;color:var(--tx2);text-transform:uppercase;margin-bottom:6px}
.fsim-tt-row{display:flex;align-items:center;gap:8px;margin:8px 0;flex-wrap:wrap}
.fsim-tt-box{background:var(--bg3);border:1px solid var(--bd);border-radius:6px;padding:10px 12px;text-align:center;min-width:70px}
.fsim-tt-val{font:700 20px "Space Grotesk",Inter;color:var(--tx);line-height:1}
.fsim-tt-lbl{font-size:10px;color:var(--tx2);margin-top:3px}
.fsim-tt-arrow{color:var(--tx2);font-size:18px;flex-shrink:0}
.fsim-tt-box-after{border-color:var(--wn)}
.fsim-tt-box-bad{border-color:#FF0000;background:#1a0505}.fsim-tt-box-bad .fsim-tt-val{color:#FF5555}
.fsim-tt-box-good{border-color:#32D69A;background:#051a0e}.fsim-tt-box-good .fsim-tt-val{color:#32D69A}

/* Cascading Failure & Queueing UI */
.cascade-step{background:var(--bg3);border-left:3px solid #FF5555;padding:8px 10px;margin:6px 0;border-radius:0 4px 4px 0;font-size:12px}
.cascade-active{border-left-color:#FF0000;background:linear-gradient(90deg,#3a0a0a,var(--bg3))}
.los-badge{display:inline-block;padding:2px 7px;border-radius:4px;font-weight:700;font-size:11px}
.los-a{background:#0e3826;color:#32D69A;border:1px solid #32D69A}
.los-c{background:#382c0e;color:#FFB84D;border:1px solid #FFB84D}
.los-f{background:#3d0d0d;color:#FF5470;border:1px solid #FF5470;animation:pulseRed 1.8s infinite}
@keyframes pulseRed{0%,100%{opacity:1}50%{opacity:0.65}}

/* Report Modal (Screen + Print) */
#report-modal{display:none;position:fixed;inset:0;background:rgba(5,9,16,0.85);backdrop-filter:blur(6px);z-index:9999;overflow-y:auto;padding:20px}
#report-modal.active{display:flex;align-items:flex-start;justify-content:center}
.report-paper{background:#ffffff;color:#111827;width:100%;max-width:900px;border-radius:8px;box-shadow:0 20px 40px rgba(0,0,0,0.6);padding:36px;margin:20px 0;font-family:Inter,system-ui,sans-serif}
.report-header{border-bottom:2px solid #0052cc;padding-bottom:14px;margin-bottom:18px;display:flex;justify-content:space-between;align-items:flex-start}
.report-title{font-size:22px;font-weight:800;color:#0b1a30;letter-spacing:-0.02em}
.report-sub{font-size:12px;color:#4b5563;margin-top:4px}
.report-badge{background:#e0edff;color:#0052cc;font-weight:700;font-size:11px;padding:4px 8px;border-radius:4px;border:1px solid #b3d4ff}
.report-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:16px 0}
.report-stat{background:#f9fafb;border:1px solid #e5e7eb;border-radius:6px;padding:12px;text-align:center}
.report-stat-num{font-size:24px;font-weight:800;color:#111827;font-family:"Space Grotesk",Inter,sans-serif}
.report-stat-lbl{font-size:11px;color:#6b7280;margin-top:2px;text-transform:uppercase;font-weight:600}
.report-sec{margin:20px 0}
.report-sec-h{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;color:#1f2937;border-bottom:1px solid #e5e7eb;padding-bottom:6px;margin-bottom:10px}
.report-tbl{width:100%;border-collapse:collapse;font-size:12px;margin:8px 0}
.report-tbl th{background:#f3f4f6;color:#374151;font-weight:600;padding:6px 10px;border:1px solid #e5e7eb;text-align:left}
.report-tbl td{padding:6px 10px;border:1px solid #e5e7eb;color:#1f2937}
.report-callout{background:#eff6ff;border-left:4px solid #2563eb;padding:10px 14px;border-radius:0 6px 6px 0;font-size:12px;color:#1e3a8a;margin:12px 0}
.report-sign{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:30px;padding-top:20px;border-top:1px dashed #d1d5db;font-size:12px;color:#4b5563}
.report-actions{display:flex;gap:10px;margin-bottom:16px;justify-content:flex-end}

@media print{
  body *{visibility:hidden}
  #report-modal, #report-modal *{visibility:visible}
  #report-modal{position:absolute;left:0;top:0;width:100%;background:#ffffff;padding:0;margin:0;display:block}
  .report-paper{box-shadow:none;margin:0;width:100%;max-width:100%;padding:15mm}
  .report-actions{display:none!important}
  @page{margin:10mm;size:A4}
}
</style></head>
<body><div id="app">
<header id="top"><div class="brand">NODAL<small>Bengaluru Metro Intelligence</small></div><input id="q" list="stlist" placeholder="Search a station…" autocomplete="off" aria-label="Search station">
<div class="seg" id="modes"><button data-v="geo" class="on">Geographic</button><button data-v="graph">Graph theory</button><button data-v="split">Split</button></div>
<div class="seg" id="bases"><button data-v="roadmap" class="on">Roadmap</button><button data-v="light">Light</button><button data-v="satellite">Satellite</button><button data-v="hybrid">Hybrid</button></div>
<select id="vp" class="ib" title="View presets"><option value="">View presets…</option><option value="geo">1 · Geographic map</option><option value="sat">2 · Satellite map</option><option value="city3d">3 · 3D city view</option><option value="graph">4 · Graph theory view</option><option value="plan">5 · Infrastructure planning view</option><option value="heat">6 · Accessibility heatmap</option></select><div class="sp"></div><button class="ib" id="pitch" title="Toggle 2D / 3D tilt">3D tilt</button><button class="ib" id="reset" title="Reset camera">Reset view</button><button class="ib" id="pn" title="Show / hide the side panel (full-screen map)">Panel</button><button class="ib" id="fs" title="Full screen">⛶</button></header>
<nav id="nav"><div class="nav-section-label">MODULES</div><button data-m="cc"><span>◉ Command Center</span></button><button data-m="plan" class="hot"><span>✦ METRO PLANNING STUDIO</span></button><button data-m="route"><span>➤ Route Optimizer</span></button><button data-m="algo"><span>▶ Algorithm Lab</span></button><button data-m="trains"><span>🚆 Train Simulation</span></button><button data-m="multi"><span>🚌 Multimodal Routes</span></button><button data-m="econ"><span>₹ Economics</span></button>
<button data-m="exp"><span>⌥ Network Expansion</span></button><button data-m="intel"><span>◈ Network Intelligence</span></button><button data-m="fail"><span>⚠ Failure Simulator</span></button><button data-m="xfer"><span>⇄ Interchange Lab</span></button><button data-m="crowd"><span>👥 Platform Queueing</span></button><button data-m="learn"><span>🎓 Learn &amp; Challenges</span></button><button data-m="math"><span>∑ Reference</span></button>
<div class="sp"></div><button id="tog"><span>« Collapse</span><b>»</b></button></nav>
<main id="stage" class="m-geo"><div id="map"></div><div id="graph"><canvas></canvas><div class="gh" id="gh"></div></div>
<div id="layers"><h4 id="lh">LAYERS <span>▾</span></h4><div class="lb" id="lb"></div></div><div class="legend" id="legend"></div></main>
<aside><div id="info"></div><div id="mod">Loading…</div></aside></div>
<datalist id="stlist"></datalist>
<div id="report-modal">
  <div class="report-paper">
    <div class="report-actions">
      <button class="b p" onclick="window.print()">🖨️ Print / Save as PDF</button>
      <button class="b" onclick="document.getElementById('report-modal').classList.remove('active')">✕ Close</button>
    </div>
    <div id="report-content"></div>
  </div>
</div>
<script type="module" src="app.mjs"></script><script type="module" src="ext.mjs"></script></body></html>
